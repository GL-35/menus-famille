<title>Menus de la famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F2; --card:#FFFFFF; --ink:#2B2A28; --muted:#7A746C; --line:#ECE5DB;
  --green:#2F5D50; --green-soft:#E3EEE9; --sun:#E9A23B; --sun-soft:#FCEFD9;
  --moon:#5B6BA8; --moon-soft:#E6E9F5; --red:#C4553F; --note:#8A5A9E; --note-soft:#F1E7F5;
  --r:14px; --shadow:0 1px 3px rgba(40,30,20,.08),0 4px 14px rgba(40,30,20,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.app{max-width:760px;margin:0 auto;padding:0 14px 96px}
header{padding:calc(18px + env(safe-area-inset-top)) 2px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{margin:0;font-size:22px;font-weight:800;color:var(--green)}
header .sub{font-size:13px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.sync.err{color:var(--red)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;padding:10px 4px 12px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--green)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.view{display:none}.view.on{display:block}

/* calendar */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.monthbar h2{margin:0;font-size:18px;text-transform:capitalize}
.iconbtn{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px;color:var(--green)}
.today-btn{font-size:13px;font-weight:700;color:var(--green);padding:6px 10px;border-radius:20px;background:var(--green-soft)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0 4px;text-transform:uppercase}
.day{aspect-ratio:1/1.08;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 2px 4px;position:relative;border:2px solid transparent;min-width:0}
.day.out{opacity:.35}
.day.we{background:#F6F2EC}
.day .n{font-weight:700;font-size:14px}
.day.today .n{background:var(--green);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:13px}
.day.sel{border-color:var(--green)}
.day .bars{display:flex;flex-direction:column;gap:3px;width:78%;margin-top:auto}
.day .bar{height:5px;border-radius:3px;background:var(--line)}
.day .bar.m.f{background:var(--sun)}
.day .bar.s.f{background:var(--moon)}
.day .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--note)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 2px 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:5px;border-radius:3px;margin-right:5px;vertical-align:middle}

.dayhead{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.dayhead .dh{flex:1;text-align:center;min-width:0}
.dayhead .dh .tag{display:block;margin-top:1px}
.navarrow{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--shadow);color:var(--green);font-size:20px;font-weight:700;display:grid;place-items:center;line-height:1}
.navarrow.sm{width:30px;height:30px;font-size:17px;box-shadow:none;background:#F3EEE7}
.weekhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.weekhead h4{flex:1;text-align:center;margin:0 !important;font-size:14.5px}
.swipezone{touch-action:pan-y}
@keyframes inL{from{opacity:.2;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:.2;transform:translateX(-40px)}to{opacity:1;transform:none}}
.slide-l{animation:inL .22s ease-out}
.slide-r{animation:inR .22s ease-out}
.swipehint{font-size:11.5px;color:var(--muted);text-align:center;margin:-4px 0 8px}
.dayhead h3{margin:0;font-size:18px}
.dayhead .dh h3{font-size:17px}
.dayhead .tag{font-size:12px;color:var(--muted)}
.slot{border-radius:var(--r);padding:12px 14px;margin-bottom:10px;background:#fff;box-shadow:var(--shadow);border-left:5px solid var(--sun)}
.slot.soir{border-left-color:var(--moon)}
.slot .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--sun)}
.slot.soir .lab{color:var(--moon)}
.slot .plat{font-size:17px;font-weight:700;margin:3px 0 2px}
.slot .empty{color:var(--muted);font-style:italic;margin:4px 0}
.slot .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot .ing{font-size:13px;color:var(--muted);margin-top:4px}
.notebox{margin-top:8px;background:var(--note-soft);color:#5E3A6E;border-radius:10px;padding:7px 10px;font-size:14px;display:flex;gap:6px;align-items:flex-start}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;background:var(--green-soft);color:var(--green)}
.btn.main{background:var(--green);color:#fff}
.btn.ghost{background:#F3EEE7;color:var(--ink)}
.btn.danger{background:#F8E3DE;color:var(--red)}
.btn.note{background:var(--note-soft);color:var(--note)}
.btn:disabled{opacity:.5}
.btn.gcal{background:#E8F0FE;color:#1A56C4}
.progress{font-size:14px;margin-top:10px;white-space:pre-line}
.progress .ok{color:#2E7D32}.progress .ko{color:var(--red)}
.weekbox{margin-top:16px}
.weekbox h4{margin:0 0 8px;font-size:15px}
.weekrow{display:grid;grid-template-columns:56px 1fr 1fr;gap:6px;align-items:stretch;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.weekrow:first-of-type{border-top:none}
.weekrow.cur .d{color:var(--green)}
.weekrow .d{font-weight:800;text-transform:capitalize;color:var(--muted);padding-top:2px}
.weekrow .c{background:#FAF7F3;border-radius:8px;padding:5px 7px;min-height:30px;cursor:pointer}
.weekrow .c.f.m{background:var(--sun-soft)}
.weekrow .c.f.s{background:var(--moon-soft)}
.weekrow .c small{display:block;color:var(--note);font-weight:700}
.weekrow .c .mut{color:var(--muted)}

/* menus list */
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;-webkit-appearance:none;appearance:none}
.search::-webkit-search-cancel-button{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 11px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.count{font-size:13px;color:var(--muted);margin:4px 2px 8px}
.mcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px}
.mcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.mcard .t{font-weight:700;font-size:16px}
.mcard .acc{font-size:13px;color:var(--muted)}
.mcard .tm{flex:none;text-align:right;font-size:13px;font-weight:800}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:11.5px;padding:2px 8px;border-radius:10px;background:#F3EEE7;color:#5c564f;font-weight:700}
.pill.d0{background:#D8F0DD;color:#25683A}.pill.d1{background:#E7F2DE;color:#43712A}.pill.d2{background:#FCEFC8;color:#8A6410}.pill.d3{background:#F9DCCF;color:#9A3E25}
.pill.mine{background:var(--note-soft);color:var(--note)}
.pill.bzh{background:#1F2937;color:#fff}
.pill.fr{background:#E3EAF8;color:#2F4C8C}
.pill.resto{background:#7A2E2E;color:#fff}
.pill.world{background:#E6F4F1;color:#1E6B5C}
.pill.region{background:#FFF0E0;color:#8A4B12}
.star{flex:none;font-size:22px;line-height:1;color:#C9BFB2;padding:2px 4px}
.star.on{color:#E9A23B}
.hist{font-size:12px;color:var(--muted);margin-top:5px}
.hist.never{color:var(--green);font-weight:700}
.pen{font-size:15px;padding:2px 4px;margin-left:2px;vertical-align:middle;opacity:.85}
.notebox .pen{margin-left:auto;flex:none}
.platrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mcard .more{display:none;margin-top:8px;font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.mcard.open .more{display:block}
.mcard .more p{margin:4px 0}
.fast{color:#2E7D32}.slow{color:var(--red)}

/* courses */
.wk{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.wk h2{margin:0;font-size:16px;text-align:center}
.shop li{list-style:none;display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.shop ul{padding:0;margin:0}
.shop input{width:20px;height:20px;accent-color:var(--green)}
.shop li.done span{text-decoration:line-through;color:var(--muted)}
.shop .x{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.sectitle{font-size:13px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;margin:16px 2px 6px}

/* sheet */
.overlay{position:fixed;top:0;left:0;right:0;height:100%;background:rgba(30,25,20,.38);z-index:40;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
/* clavier ouvert : la fenêtre se place en haut de l'écran, au-dessus du clavier */
.overlay.top{align-items:flex-start}
.overlay.top .sheet{border-radius:0 0 20px 20px;max-height:52vh;padding-bottom:0;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.overlay.top .sheet.tall{height:52vh}
.overlay.top .sheet .bd{padding-bottom:12px}
.overlay.top .tools .toggle,.overlay.top #pfpanel,.overlay.top #pactive{display:none}
.sheet .tools .fpanel{max-height:38vh;overflow-y:auto}
.overlay.top .sheet .hd{padding:10px 16px 8px}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet .hd{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.sheet .hd h3{margin:0;font-size:17px}
.sheet .bd{padding:12px 16px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.sheet.tall{height:92%}
.sheet .tools{padding:10px 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet .tools .toggle{margin:6px 0 4px;font-size:13px}
.sheet .tools .chips{margin-top:4px}
.searchwrap{position:relative}
.searchwrap .search{padding-right:40px;font-size:16px}
.searchwrap .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:#EFE9E1;color:var(--muted);font-size:16px;display:none;place-items:center}
.searchwrap.has .clr{display:grid}
mark{background:#FFE3A3;color:inherit;border-radius:3px;padding:0 1px}
.pick .ingm{font-size:12px;color:var(--muted);margin-top:2px}
.rescount{font-size:12.5px;color:var(--muted);margin:2px 2px 8px;font-weight:700}
.stickybar{position:sticky;top:0;z-index:15;background:var(--bg);padding:8px 0 8px;margin:0 -2px}
.searchrow{display:flex;gap:8px;align-items:center}
.searchrow .searchwrap{flex:1}
.fbtn{flex:none;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;position:relative}
.fbtn.on{background:var(--green);color:#fff;border-color:var(--green)}
.fbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--sun);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.fpanel{display:none;flex-direction:column;gap:8px;margin-top:8px}
.fpanel.on{display:flex}
.activef{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.activef .chip{font-size:12px;padding:4px 9px;background:var(--green-soft);border-color:transparent;color:var(--green)}
body.kbd nav.tabs{display:none}
body.kbd .app{padding-bottom:20px}
.close{font-size:24px;line-height:1;color:var(--muted);padding:4px 8px}
.pick{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow);width:100%;text-align:left}
.pick .t{font-weight:700}
.pick .s{font-size:12.5px;color:var(--muted)}
label.fl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff}
textarea.inp{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.row2 > div{min-width:0}
input[type=time].inp,input[type=date].inp{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0}
.toggle input{width:18px;height:18px;accent-color:var(--green)}
.seg{display:flex;background:#EFE9E1;border-radius:10px;padding:3px}
.seg button{flex:1;padding:7px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.hint{font-size:13px;color:var(--muted);margin:2px 2px 10px}
@media (min-width:600px){ .day{aspect-ratio:1/0.85} }
</style>
</head>

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function key(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fromKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function monday(d){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
function isWE(d){ return d.getDay()===0 || d.getDay()===6; }
function longDate(d){ return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]; }
function allMenus(){ return BASE.concat(state.custom.map(m=>({...m, mine:true}))); }
function findMenu(nom){ return allMenus().find(m => m.nom === nom); }
function isFav(nom){ return state.fav.includes(nom); }
function toggleFav(nom){
  state.fav = isFav(nom) ? state.fav.filter(x=>x!==nom) : state.fav.concat([nom]);
  saveFav(); renderAll(); toast(isFav(nom) ? "★ Ajouté aux favoris" : "Retiré des favoris");
}
/* historique : dernière fois cuisiné (jusqu'à aujourd'hui) et prochaine fois prévue */
let _hist = null, _histSrc = null;
function hist(){
  if(_histSrc === state.plan && _hist) return _hist;
  const last = {}, next = {}, tk = key(today);
  for(const [k, day] of Object.entries(state.plan)){
    for(const s of ["midi","soir"]){
      const p = day[s] && day[s].plat; if(!p) continue;
      if(k <= tk){ if(!last[p] || k > last[p]) last[p] = k; }
      else { if(!next[p] || k < next[p]) next[p] = k; }
    }
  }
  _hist = {last, next}; _histSrc = state.plan; return _hist;
}
function daysSince(nom){ const l = hist().last[nom]; return l ? Math.round((today - fromKey(l))/86400000) : Infinity; }
function lastText(nom){
  const h = hist(), n = h.next[nom];
  const d = daysSince(nom);
  let s = d===Infinity ? "Jamais cuisiné" : d===0 ? "Prévu aujourd'hui" : d===1 ? "Fait hier" : d<14 ? `Fait il y a ${d} j` : d<60 ? `Fait il y a ${Math.round(d/7)} sem.` : `Fait il y a ${Math.round(d/30)} mois`;
  if(n){ const nd = fromKey(n); s += ` · prévu ${JOURS[nd.getDay()].slice(0,3)}. ${nd.getDate()}`; }
  return s;
}
const FLAGS = {"Italie":"🇮🇹","Grèce":"🇬🇷","Liban":"🇱🇧","Maroc":"🇲🇦","Maghreb":"🇲🇦","Inde":"🇮🇳","Thaïlande":"🇹🇭","Vietnam":"🇻🇳","Chine":"🇨🇳","Japon":"🇯🇵","Corée":"🇰🇷","Mexique":"🇲🇽","États-Unis":"🇺🇸","Hongrie":"🇭🇺","Royaume-Uni":"🇬🇧","Sénégal":"🇸🇳","Espagne":"🇪🇸"};
function origPill(m){
  if(m.orig==="Cuisine du monde") return `<span class="pill world">${FLAGS[m.pays]||"🌍"} ${esc(m.pays||"Monde")}</span>`;
  if(m.orig==="Régional") return `<span class="pill region">📍 ${esc(m.pays||"Région")}</span>`;
  return origPill0(m);
}
function origPill0(m){ return m.orig==="Breton" ? '<span class="pill bzh">Breton</span>' : m.orig==="Classique français" ? '<span class="pill fr">Classique</span>' : m.orig==="Restaurant" ? '<span class="pill resto">Restaurant</span>' : ""; }
function diffClass(d){ return "d"+Math.max(0,DIFFS.indexOf(d)); }
function fitsSlot(m, d, slot){
  const okM = m.moment === "Midi ou soir" || m.moment === SLOTS[slot];
  const okJ = m.jours === "Tous" || (isWE(d) ? m.jours === "Week-end" : m.jours === "Semaine");
  return okM && okJ;
}
function getSlot(k, slot){ return (state.plan[k] && state.plan[k][slot]) || null; }
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),1800); }

/* ---------- persistence ---------- */
const LS = "menus-famille-v1";
function loadLocal(){ try{ const s=JSON.parse(localStorage.getItem(LS)||"null"); if(s){ state.plan=s.plan||{}; state.custom=s.custom||[]; state.fav=s.fav||[]; } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }

const writers = {};
function queueWrite(path, getBody){
  saveLocal();
  if(!db || !canWrite) return;
  const w = writers[path] || (writers[path] = {busy:false, again:false});
  if(w.busy){ w.again = true; return; }
  const run = async () => {
    w.busy = true; w.again = false;
    setSync("Enregistrement…");
    try{ await db.doc(path).set(getBody()); setSync("✓ Enregistré"); }
    catch(e){
      if(e && e.code === "invalid_argument"){ canWrite = false; setSync("Lecture seule", true); }
      else if(e && e.code === "unavailable"){ await new Promise(r=>setTimeout(r, 800+Math.random()*800)); try{ await db.doc(path).set(getBody()); setSync("✓ Enregistré"); }catch(_){ setSync("Non enregistré", true); } }
      else setSync("Non enregistré", true);
    }
    w.busy = false;
    if(w.again) run();
  };
  run();
}
function savePlan(){ queueWrite("famille/planning", () => ({ plan: state.plan })); }
function saveCustom(){ queueWrite("famille/plats", () => ({ items: state.custom })); }
function saveFav(){ queueWrite("famille/favoris", () => ({ items: state.fav })); }
function setSync(t, err){ const el=$("sync"); el.textContent=t; el.classList.toggle("err", !!err); }

async function initDb(){
  try{ db = await claude.use("db"); }catch(e){ db = null; }
  if(!db){ setSync("Sauvegarde sur cet appareil"); return; }
  try{
    const u = await claude.use("user");
    if(u && u.can){ const c = await u.can("data.write"); if(c === false){ canWrite = false; } }
  }catch(e){}
  let gotPlan=false;
  const timer = setTimeout(()=>{ if(!gotPlan) setSync("Connexion lente…", true); }, 10000);
  db.doc("famille/planning").onSnapshot(s => {
    if(!s.metadata.fromCache){ gotPlan=true; clearTimeout(timer); setSync(canWrite ? "✓ Synchronisé" : "Lecture seule", !canWrite); }
    if(s.exists){ const d=s.data(); if(d && d.plan && typeof d.plan==="object"){ state.plan = JSON.parse(JSON.stringify(d.plan)); saveLocal(); renderAll(); } }
    else if(!s.metadata.fromCache && Object.keys(state.plan).length && canWrite){ savePlan(); }
  }, e => { clearTimeout(timer); setSync("Sauvegarde sur cet appareil", true); });
  db.doc("famille/favoris").onSnapshot(s => {
    if(s.exists){ const d=s.data(); if(d && Array.isArray(d.items)){ state.fav = d.items.slice(); saveLocal(); renderAll(); } }
    else if(!s.metadata.fromCache && state.fav.length && canWrite){ saveFav(); }
  }, e => {});
  db.doc("famille/plats").onSnapshot(s => {
    if(s.exists){ const d=s.data(); if(d && Array.isArray(d.items)){ state.custom = JSON.parse(JSON.stringify(d.items)); saveLocal(); renderAll(); } }
    else if(!s.metadata.fromCache && state.custom.length && canWrite){ saveCustom(); }
  }, e => {});
}

/* ---------- plan mutations ---------- */
function setSlot(k, slot, patch){
  const day = state.plan[k] ? {...state.plan[k]} : {};
  const cur = day[slot] ? {...day[slot]} : {};
  Object.assign(cur, patch);
  Object.keys(cur).forEach(x => { if(!cur[x]) delete cur[x]; });
  if(Object.keys(cur).length) day[slot] = cur; else delete day[slot];
  if(Object.keys(day).length) state.plan[k] = day; else delete state.plan[k];
  savePlan(); renderAll();
}

/* ---------- calendar ---------- */
function renderCal(){
  $("monthTitle").textContent = MOIS[viewMonth.getMonth()]+" "+viewMonth.getFullYear();
  $("dows").innerHTML = ["Lu","Ma","Me","Je","Ve","Sa","Di"].map(d=>`<div class="dow">${d}</div>`).join("");
  const start = monday(viewMonth);
  let h = "";
  for(let i=0;i<42;i++){
    const d = addDays(start,i);
    if(i===35 && d.getMonth()!==viewMonth.getMonth()) break;
    const k = key(d), p = state.plan[k] || {};
    const hasNote = (p.midi && p.midi.note) || (p.soir && p.soir.note);
    const cls = ["day", d.getMonth()!==viewMonth.getMonth()?"out":"", isWE(d)?"we":"", +d===+today?"today":"", +d===+sel?"sel":""].join(" ");
    h += `<button class="${cls}" data-k="${k}" aria-label="${longDate(d)}">
      ${hasNote?'<span class="dot"></span>':''}
      <span class="n">${d.getDate()}</span>
      <span class="bars"><span class="bar m ${p.midi&&p.midi.plat?'f':''}"></span><span class="bar s ${p.soir&&p.soir.plat?'f':''}"></span></span>
    </button>`;
  }
  $("cal").innerHTML = h;
}

function renderDay(){
  const k = key(sel);
  { const s=longDate(sel); $("dayTitle").textContent = s.charAt(0).toUpperCase()+s.slice(1); }
  $("dayTag").textContent = isWE(sel) ? "Week-end" : "Semaine";
  let h = "";
  for(const slot of ["midi","soir"]){
    const s = getSlot(k, slot) || {};
    const m = s.plat ? findMenu(s.plat) : null;
    h += `<div class="slot ${slot}"><div class="lab">${slot==="midi"?"☀️ Midi":"🌙 Soir"}</div>`;
    if(s.plat){
      h += `<div class="platrow"><div class="plat" data-act="${!m || m.mine ? 'edit' : 'pick'}" data-slot="${slot}" style="cursor:pointer">${esc(s.plat)}${!m || m.mine ? ` <button class="pen" data-act="edit" data-slot="${slot}" aria-label="Modifier le plat">✏️</button>` : ""}</div>${m?`<button class="star ${isFav(s.plat)?'on':''}" data-act="fav" data-slot="${slot}" aria-label="Favori">${isFav(s.plat)?"★":"☆"}</button>`:""}</div>`;
      if(m){
        h += `<div class="meta"><span>⏱ ${m.temps} min</span><span class="pill ${diffClass(m.diff)}">${esc(m.diff)}</span>${m.acc&&m.acc!=="—"?`<span>+ ${esc(m.acc)}</span>`:""}</div>`;
        if(m.astuce) h += `<div class="ing">💡 ${esc(m.astuce)}</div>`;
      }
    } else h += `<div class="empty">Rien de prévu</div>`;
    if(s.note) h += `<div class="notebox" data-act="note" data-slot="${slot}" style="cursor:pointer">📝 <span style="flex:1">${esc(s.note)}</span><button class="pen" data-act="note" data-slot="${slot}" aria-label="Modifier la note">✏️</button></div>`;
    h += `<div class="actions">
      <button class="btn ${s.plat?'ghost':'main'}" data-act="pick" data-slot="${slot}">${s.plat?"Changer":"Choisir un plat"}</button>
      ${s.note ? "" : `<button class="btn note" data-act="note" data-slot="${slot}">+ Note</button>`}
      ${s.plat||s.note?`<button class="btn danger" data-act="clear" data-slot="${slot}">Effacer</button>`:""}
    </div></div>`;
  }
  $("slots").innerHTML = h;
}

function renderWeek(){
  const mon = monday(sel);
  const sun = addDays(mon,6);
  $("weekTitle").textContent = mon.getMonth()===sun.getMonth() ? `Semaine du ${mon.getDate()} au ${sun.getDate()} ${MOIS[sun.getMonth()]}` : `Du ${mon.getDate()} ${MOIS[mon.getMonth()].slice(0,4)}. au ${sun.getDate()} ${MOIS[sun.getMonth()].slice(0,4)}.`;
  let h = "";
  for(let i=0;i<7;i++){
    const d = addDays(mon,i), k = key(d);
    const cell = (slot, c) => { const s = getSlot(k,slot)||{}; return `<div class="c ${c} ${s.plat?'f':''}" data-k="${k}">${s.plat?esc(s.plat):'<span class="mut">—</span>'}${s.note?`<small>📝 ${esc(s.note)}</small>`:""}</div>`; };
    h += `<div class="weekrow${+d===+sel?' cur':''}"><div class="d">${JOURS[d.getDay()].slice(0,3)} ${d.getDate()}</div>${cell("midi","m")}${cell("soir","s")}</div>`;
  }
  $("weekList").innerHTML = `<div class="weekrow" style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase"><div></div><div>☀️ Midi</div><div>🌙 Soir</div></div>` + h;
}

function openSheet(title, html, after, opts){
  opts = opts || {};
  $("shTitle").textContent = title;
  $("shTools").innerHTML = opts.tools || ""; $("shTools").style.display = opts.tools ? "" : "none";
  $("shBody").innerHTML = html;
  document.querySelector("#ov .sheet").classList.toggle("tall", !!opts.tall);
  $("ov").classList.add("on"); document.body.style.overflow = "hidden";
  fitViewport();
  $("shBody").scrollTop = 0; if(after) after();
}
function closeSheet(){ if(document.activeElement) document.activeElement.blur(); $("ov").classList.remove("on","top"); document.body.style.overflow = ""; }
/* garde la fenêtre au-dessus du clavier sur téléphone */
function fitViewport(){
  const vv = window.visualViewport, ov = $("ov");
  if(!vv){ ov.style.height = ""; ov.style.top = ""; return; }
  ov.style.height = vv.height + "px";
  ov.style.top = vv.offsetTop + "px";
}
if(window.visualViewport){
  visualViewport.addEventListener("resize", fitViewport);
  visualViewport.addEventListener("scroll", fitViewport);
}
const TYPING = "input[type=search], input[type=text], input:not([type]), input[type=number], textarea";
document.addEventListener("focusin", e => {
  if(!e.target.matches || !e.target.matches(TYPING + ", input.inp")) return;
  document.body.classList.add("kbd");
  if(e.target.closest("#ov") && e.target.matches(TYPING)){
    $("ov").classList.add("top");
    setTimeout(() => { try{ e.target.scrollIntoView({block:"nearest"}); }catch(_){} }, 50);
  }
});
document.addEventListener("focusout", () => setTimeout(() => {
  const a = document.activeElement;
  if(!a || !a.matches || !a.matches(TYPING + ", input.inp")) document.body.classList.remove("kbd");
  if(!a || !a.matches || !a.matches(TYPING) || !a.closest("#ov")) $("ov").classList.remove("top");
}, 80));

/* recherche sans accents, avec surlignage */
function fold(s){ return Array.from(String(s||"")).map(c => (c.normalize("NFD")[0] || c).toLowerCase()).join(""); }
function hl(text, q){
  text = String(text||"");
  const fq = fold(q.trim()); if(!fq) return esc(text);
  const chars = Array.from(text), ft = chars.map(c => (c.normalize("NFD")[0]||c).toLowerCase());
  let out = "", i = 0; const n = Array.from(fq).length;
  while(i < chars.length){
    if(ft.slice(i, i+n).join("") === fq){ out += "<mark>" + esc(chars.slice(i,i+n).join("")) + "</mark>"; i += n; }
    else { out += esc(chars[i]); i++; }
  }
  return out;
}
function matchScore(m, q){
  const fq = fold(q.trim()); if(!fq) return 1;
  const fn = fold(m.nom);
  if(fn.startsWith(fq)) return 4;
  if(fn.split(/[\s'-]+/).some(w => w.startsWith(fq))) return 3;
  if(fn.includes(fq)) return 2;
  if(fold(m.ing + " " + (m.acc||"")).includes(fq)) return 1.5;
  return 0;
}
function ingSnippet(m, q){
  const fq = fold(q.trim()); if(!fq || fold(m.nom).includes(fq)) return "";
  const parts = (m.ing||"").split(",").map(x=>x.trim()).filter(x => fold(x).includes(fq));
  if(!parts.length && fold(m.acc||"").includes(fq)) return "Avec : " + hl(m.acc, q);
  return parts.length ? "Contient : " + parts.map(x => hl(x, q)).join(", ") : "";
}
function bindSearch(input, wrap, clr, onChange){
  const upd = () => { wrap.classList.toggle("has", !!input.value); onChange(input.value); };
  input.addEventListener("input", upd);
  input.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); input.blur(); } });
  clr.addEventListener("click", () => { input.value = ""; upd(); input.focus(); });
}
$("shClose").onclick = closeSheet;
$("ov").addEventListener("click", e => { if(e.target.id==="ov") closeSheet(); });
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });

function openPicker(k, slot){
  const d = fromKey(k);
  const PKEYS = ["fShow","fTri","fDiff","fType","fTemps","fOrig","fMoment","fJours"];
  const pf = { q:"", adapt:true, moment:"Tous", jours:"Tous", diff:"Tous", type:"Tous", temps:"Tous", orig:"Tous", show:"Tous", tri:"Par défaut" };
  let open = false;
  const tools = `
    <div class="searchrow">
      <div class="searchwrap" id="pqwrap"><input class="search" id="pq" placeholder="Plat ou ingrédient…" type="search" enterkeyhint="search" autocomplete="off"><button class="clr" id="pqclr" aria-label="Effacer la recherche">✕</button></div>
      <button class="fbtn" id="pfbtn">Filtres</button>
    </div>
    <label class="toggle"><input type="checkbox" id="padapt" checked> Plats adaptés au ${SLOTS[slot].toLowerCase()} ${isWE(d)?"du week-end":"en semaine"}</label>
    <div class="fpanel" id="pfpanel"></div>
    <div class="activef" id="pactive"></div>`;
  openSheet(`${SLOTS[slot]} · ${longDate(d)}`, `
    <div class="actions" id="pacts" style="margin:0 0 10px"><button class="btn main" id="prand">🎲 Au hasard</button><button class="btn ghost" id="pfree">✏️ Autre plat</button></div>
    <div class="rescount" id="pcount"></div>
    <div id="plist"></div>`, () => {
    const candidates = (adapt = pf.adapt) => allMenus()
      .filter(m => matchScore(m, pf.q) > 0 && (!adapt || fitsSlot(m,d,slot)) && passFilters(m, pf))
      .sort((a,b) => sortWith(pf, pf.q)(a,b) || (isFav(b.nom) - isFav(a.nom)) || a.temps - b.temps);
    const draw = () => {
      const nAct = PKEYS.filter(id => pf[FDEF[id][0]] !== dflt(FDEF[id][0])).length;
      $("pfbtn").innerHTML = "Filtres" + (nAct ? `<span class="badge">${nAct}</span>` : "");
      $("pfbtn").classList.toggle("on", open);
      $("pfpanel").classList.toggle("on", open);
      $("pfpanel").innerHTML = open ? filterRowsHtml(pf, PKEYS) : "";
      $("pactive").innerHTML = open ? "" : activeChipsHtml(pf, PKEYS);
      const q = pf.q.trim(), res = candidates();
      $("pacts").style.display = q ? "none" : "";
      $("pcount").textContent = q ? (res.length ? `${res.length} résultat${res.length>1?"s":""} pour « ${q} »` : "") : `${res.length} plat${res.length>1?"s":""} proposé${res.length>1?"s":""}`;
      let h = res.map(m => {
        const sn = ingSnippet(m, q);
        return `<button class="pick" data-n="${esc(m.nom)}"><div style="min-width:0"><div class="t">${hl(m.nom, q)}</div>
          <div class="s">${isFav(m.nom)?'<span style="color:#E9A23B">★</span> ':""}${esc(m.acc&&m.acc!=="—"?m.acc+" · ":"")}${esc(m.type)} ${origPill(m)}</div>${sn?`<div class="ingm">${sn}</div>`:""}<div class="ingm">🕒 ${lastText(m.nom)}</div></div>
          <div style="text-align:right;flex:none"><div style="font-weight:800;font-size:13px">${m.temps} min</div><span class="pill ${diffClass(m.diff)}">${esc(m.diff)}</span></div></button>`;
      }).join("");
      if(!res.length){
        const other = pf.adapt ? candidates(false).length : 0;
        h = `<p class="hint">Aucun plat ne correspond${q?` à « ${esc(q)} »`:" à ces filtres"}.</p>` +
          (other ? `<button class="btn" id="pall" style="margin-bottom:8px">Voir les ${other} plat${other>1?"s":""} hors ${SLOTS[slot].toLowerCase()} / ${isWE(d)?"week-end":"semaine"}</button>` : "");
      }
      if(q) h += `<button class="pick" data-free="1" style="background:var(--green-soft)"><div><div class="t">✏️ Mettre « ${esc(q)} »</div><div class="s">Utiliser ce texte comme repas</div></div></button>`;
      $("plist").innerHTML = h;
      if($("pall")) $("pall").onclick = () => { pf.adapt = false; $("padapt").checked = false; draw(); };
    };
    bindSearch($("pq"), $("pqwrap"), $("pqclr"), v => { pf.q = v; draw(); $("shBody").scrollTop = 0; });
    $("padapt").onchange = e => { pf.adapt = e.target.checked; draw(); };
    $("pfbtn").onclick = () => { open = !open; draw(); };
    $("shTools").onclick = e => { const b = e.target.closest("[data-f]"); if(!b) return; pf[b.dataset.f] = b.dataset.v; draw(); $("shBody").scrollTop = 0; };
    $("plist").onclick = e => {
      const f = e.target.closest("[data-free]");
      if(f){ setSlot(k, slot, {plat: pf.q.trim()}); closeSheet(); toast("Ajouté : " + pf.q.trim()); return; }
      const b = e.target.closest("[data-n]"); if(b){ setSlot(k, slot, {plat:b.dataset.n}); closeSheet(); toast("Ajouté au "+SLOTS[slot].toLowerCase()+" du "+longDate(d)); }
    };
    /* sur téléphone : faire défiler la liste ferme le clavier et replie les filtres */
    $("shBody").addEventListener("touchstart", () => { if(document.activeElement === $("pq")) $("pq").blur(); if(open){ open = false; draw(); } }, {passive:true});
    $("prand").onclick = () => { const c=candidates(); if(!c.length) return toast("Aucun plat ne correspond"); const m=c[Math.floor(Math.random()*c.length)]; setSlot(k,slot,{plat:m.nom}); closeSheet(); toast("🎲 "+m.nom); };
    $("pfree").onclick = () => openFree(k, slot);
    draw();
  }, { tools, tall:true });
}

function openFree(k, slot){
  const cur = getSlot(k,slot) || {};
  openSheet(cur.plat ? `Modifier le repas · ${SLOTS[slot]}` : `Autre plat · ${SLOTS[slot]}`, `
    <p class="hint">Pour un repas qui n'est pas dans la liste (restaurant, restes, plat improvisé…).</p>
    <input class="inp" id="fv" maxlength="80" placeholder="Ex. : Restes de lasagnes" value="${esc(cur.plat||"")}">
    <div class="quick">${["Restes","Restaurant","Chez les grands-parents","Cantine","Pique-nique","Plateau télé"].map(x=>`<button class="chip" data-q="${x}">${x}</button>`).join("")}</div>
    <div class="actions"><button class="btn main" id="fok">Valider</button><button class="btn ghost" id="fsave">＋ Ajouter à mes plats</button></div>
    <p class="hint" style="margin-top:8px">« Ajouter à mes plats » le garde dans la liste des menus (avec temps, ingrédients…) pour le réutiliser.</p>`, () => {
    $("shBody").querySelector(".quick").onclick = e => { const b=e.target.closest("[data-q]"); if(b) $("fv").value=b.dataset.q; };
    $("fok").onclick = () => { const v=$("fv").value.trim(); setSlot(k,slot,{plat:v}); closeSheet(); toast(v ? "Repas modifié" : "Repas effacé"); };
    $("fsave").onclick = () => {
      const v = $("fv").value.trim(); if(!v) return toast("Écrivez d'abord le nom du plat");
      if(findMenu(v)){ setSlot(k,slot,{plat:v}); closeSheet(); return toast("Ce plat est déjà dans la liste"); }
      state.custom.push({ nom:v, acc:"", moment:"Midi ou soir", jours:"Tous", diff:"Facile", temps:30, type:"Viande", ing:"", astuce:"" });
      saveCustom(); setSlot(k,slot,{plat:v});
      openAddPlat(findMenu(v)); toast("Ajouté à vos plats : complétez si vous voulez");
    };
    setTimeout(()=>{ const f=$("fv"); if(!f) return; f.focus(); try{ f.setSelectionRange(f.value.length, f.value.length); }catch(_){} },50);
  });
}

  const opt = (arr, x) => arr.map(o=>`<option ${o===x?"selected":""}>${o}</option>`).join("");
  openSheet(edit ? "Modifier le plat" : "Ajouter un plat", `
    <label class="fl">Nom du plat *</label><input class="inp" id="a_nom" maxlength="80" value="${esc(v.nom)}">
    <label class="fl">Accompagnement</label><input class="inp" id="a_acc" maxlength="80" value="${esc(v.acc||"")}">
    <div class="row2"><div><label class="fl">Moment</label><select class="inp" id="a_moment">${opt(["Midi ou soir","Midi","Soir"],v.moment)}</select></div>
    <div><label class="fl">Jours</label><select class="inp" id="a_jours">${opt(["Tous","Semaine","Week-end"],v.jours)}</select></div></div>
    <div class="row2"><div><label class="fl">Difficulté</label><select class="inp" id="a_diff">${opt(DIFFS,v.diff)}</select></div>
    <div><label class="fl">Temps (min)</label><input class="inp" id="a_temps" type="number" min="1" max="600" value="${esc(v.temps)}"></div></div>
    <label class="fl">Type</label><select class="inp" id="a_type">${opt(TYPES,v.type)}</select>
    <label class="fl">Ingrédients principaux (séparés par des virgules)</label><input class="inp" id="a_ing" maxlength="200" value="${esc(v.ing||"")}">
    <label class="fl">Astuce</label><input class="inp" id="a_astuce" maxlength="150" value="${esc(v.astuce||"")}">
    <div class="actions"><button class="btn main" id="a_ok">${edit ? "Enregistrer" : "Ajouter"}</button>${edit ? '<button class="btn danger" id="a_del">Supprimer ce plat</button>' : ""}</div>`, () => {
    $("a_ok").onclick = () => {
      const nom = $("a_nom").value.trim();
      if(!nom) return toast("Donnez un nom au plat");
      if(nom !== v.nom && findMenu(nom)) return toast("Ce plat existe déjà");
      const item = { nom, acc:$("a_acc").value.trim(), moment:$("a_moment").value, jours:$("a_jours").value, diff:$("a_diff").value,
        temps: Math.max(1, parseInt($("a_temps").value)||30), type:$("a_type").value, ing:$("a_ing").value.trim(), astuce:$("a_astuce").value.trim() };
      if(edit){
        state.custom = state.custom.map(c => c.nom === edit.nom ? item : c);
        if(nom !== edit.nom){ renamePlat(edit.nom, nom); }
        saveCustom(); closeSheet(); renderAll(); toast("Plat modifié");
      } else {
        state.custom.push(item); saveCustom(); closeSheet(); renderAll(); toast("Plat ajouté");
      }
    };
    if($("a_del")) $("a_del").onclick = () => {
      const b = $("a_del");
      if(!b.dataset.confirm){ b.dataset.confirm = "1"; b.textContent = "Confirmer la suppression ?"; return; }
      state.custom = state.custom.filter(c => c.nom !== edit.nom); saveCustom(); closeSheet(); renderAll(); toast("Plat supprimé");
    };
  });
}
/* renomme un plat partout : calendrier et favoris */
function renamePlat(oldN, newN){
  let changed = false;
  for(const day of Object.values(state.plan)) for(const s of ["midi","soir"]) if(day[s] && day[s].plat === oldN){ day[s].plat = newN; changed = true; }
  if(changed) savePlan();
  if(state.fav.includes(oldN)){ state.fav = state.fav.map(x => x === oldN ? newN : x); saveFav(); }
}

/* ---------- menus list ---------- */
const FDEF = {
  fMoment:["moment",["Tous","Midi","Soir"]],
  fJours:["jours",["Tous","Semaine","Week-end"]],
  fDiff:["diff",["Tous",...DIFFS]],
  fType:["type",["Tous",...TYPES,"Mes plats"]],
  fTemps:["temps",["Tous","≤ 15 min","≤ 30 min","≤ 1 h","Plus d'1 h"]],
  fOrig:["orig",["Tous","Classique français","Régional","Breton","Restaurant","Cuisine du monde"]],
  fShow:["show",["Tous","★ Favoris","Jamais cuisinés"]],
  fTri:["tri",["Par défaut","Pas cuisiné depuis longtemps","Les plus rapides"]],
};
const FDEFAULT = { tri:"Par défaut" };
const dflt = f => FDEFAULT[f] || "Tous";
const FLABEL = { moment:"Moment", jours:"Jours", diff:"Difficulté", type:"Type", temps:"Temps", orig:"Origine", show:"Afficher", tri:"Tri" };
let fpanelOpen = false;
function renderFilters(){
  const act = Object.entries(FDEF).filter(([,[f]]) => filters[f] !== dflt(f));
  $("fbtn").innerHTML = "Filtres" + (act.length ? `<span class="badge">${act.length}</span>` : "");
  $("fbtn").classList.toggle("on", fpanelOpen);
  $("fpanel").classList.toggle("on", fpanelOpen);
  $("activef").innerHTML = fpanelOpen ? "" : act.map(([,[f]]) => `<button class="chip" data-f="${f}" data-v="${esc(dflt(f))}">${esc(filters[f])} ✕</button>`).join("");
  for(const [id,[f,vals]] of Object.entries(FDEF)){
    $(id).innerHTML = vals.map(v=>`<button class="chip ${filters[f]===v?'on':''}" data-f="${f}" data-v="${esc(v)}">${v===dflt(f)?FLABEL[f]+" : "+(v==="Tous"?"tous":v.toLowerCase()):esc(v)}</button>`).join("");
  }
}
function passFilters(m, F){
  if(F.moment!=="Tous" && !(m.moment===F.moment || m.moment==="Midi ou soir")) return false;
  if(F.jours!=="Tous" && !(m.jours===F.jours || m.jours==="Tous")) return false;
  if(F.diff!=="Tous" && m.diff!==F.diff) return false;
  if(F.orig!=="Tous" && m.orig!==F.orig) return false;
  if(F.show==="★ Favoris" && !isFav(m.nom)) return false;
  if(F.show==="Jamais cuisinés" && daysSince(m.nom)!==Infinity) return false;
  if(F.type==="Mes plats" && !m.mine) return false;
  if(F.type!=="Tous" && F.type!=="Mes plats" && m.type!==F.type) return false;
  const tm = m.temps;
  if(F.temps==="≤ 15 min" && tm>15) return false;
  if(F.temps==="≤ 30 min" && tm>30) return false;
  if(F.temps==="≤ 1 h" && tm>60) return false;
  if(F.temps==="Plus d'1 h" && tm<=60) return false;
  return true;
}
function sortWith(F, q){
  return (a,b) => {
    if(q.trim()){ const d = matchScore(b,q) - matchScore(a,q); if(d) return d; }
    if(F.tri==="Pas cuisiné depuis longtemps"){ const d = daysSince(b.nom) - daysSince(a.nom); if(d && !isNaN(d)) return d; return (isFav(b.nom)-isFav(a.nom)); }
    if(F.tri==="Les plus rapides") return a.temps - b.temps;
    return 0;
  };
}
/* panneau de filtres réutilisable (onglet Menus et choix du plat) */
function filterRowsHtml(F, keys){
  return keys.map(id => { const [f, vals] = FDEF[id];
    return `<div class="chips">${vals.map(v=>`<button class="chip ${F[f]===v?'on':''}" data-f="${f}" data-v="${esc(v)}">${v===dflt(f)?FLABEL[f]+" : "+(v==="Tous"?"tous":v.toLowerCase()):esc(v)}</button>`).join("")}</div>`; }).join("");
}
function activeChipsHtml(F, keys){
  return keys.map(id => FDEF[id][0]).filter(f => F[f] !== dflt(f)).map(f => `<button class="chip" data-f="${f}" data-v="${esc(dflt(f))}">${esc(F[f])} ✕</button>`).join("");
}
function filtered(){
  const q = filters.q;
  return allMenus().filter(m => (!q.trim() || matchScore(m, q) > 0) && passFilters(m, filters)).sort(sortWith(filters, q));
}
function renderList(){
  renderFilters();
  const res = filtered();
  const q = filters.q.trim();
  $("count").textContent = res.length + (res.length>1?" plats":" plat") + (q ? ` pour « ${q} »` : "");
  $("list").innerHTML = res.map(m => `
    <div class="mcard" data-n="${esc(m.nom)}">
      <div class="top" data-act="toggle"><div><div class="t">${hl(m.nom, q)}</div>${m.acc&&m.acc!=="—"?`<div class="acc">+ ${hl(m.acc, q)}</div>`:""}${(() => { const sn = ingSnippet(m, q); return sn ? `<div class="acc">${sn}</div>` : ""; })()}</div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none"><button class="star ${isFav(m.nom)?'on':''}" data-act="fav" aria-label="Favori">${isFav(m.nom)?"★":"☆"}</button><div class="tm ${m.temps<=20?'fast':m.temps>60?'slow':''}">⏱ ${m.temps} min</div></div></div>
      <div class="pills"><span class="pill ${diffClass(m.diff)}">${esc(m.diff)}</span><span class="pill">${esc(m.moment)}</span><span class="pill">${esc(m.jours==="Tous"?"Tous les jours":m.jours)}</span><span class="pill">${esc(m.type)}</span>${origPill(m)}${m.mine?'<span class="pill mine">Mon plat</span>':""}</div>
      <div class="hist ${daysSince(m.nom)===Infinity?'never':''}">🕒 ${lastText(m.nom)}</div>

const GSERVER = "Google Calendar";
let gcal = { cal:"", midi:"12:00", soir:"19:30", dur:60, events:{}, last:"", auto:true, on:false, err:"" };

const GLS = "menus-famille-gcal-v1";
function loadGcalLocal(){ try{ const s=JSON.parse(localStorage.getItem(GLS)||"null"); if(s) gcal = {...gcal, ...s}; }catch(e){} }
async function saveGcal(){
  try{ localStorage.setItem(GLS, JSON.stringify(gcal)); }catch(e){}
  if(gcalRef){ try{ await gcalRef.set(JSON.parse(JSON.stringify(gcal))); }catch(e){} }

async function initGcal(){

    const u = await claude.use("user");

async function getMcp(){
  if(mcp) return mcp;
  try{ mcp = await claude.use("mcp"); }catch(e){ mcp = null; }
  return mcp;
}
function payloadOf(res){
  let p = res && (res.payload !== undefined ? res.payload : res);
  if(typeof p === "string"){ try{ p = JSON.parse(p); }catch(e){} }
  if(p && Array.isArray(p.content)){ const t = p.content.find(c=>c.type==="text"); if(t){ try{ p = JSON.parse(t.text); }catch(e){} } }
  return p;
}
function findId(o, depth=0){
  if(!o || typeof o !== "object" || depth>4) return null;
  if(typeof o.id === "string" && (o.summary || o.start || o.htmlLink || o.status)) return o.id;
  for(const k of ["event","result","data"]) { const r = findId(o[k], depth+1); if(r) return r; }
  if(typeof o.id === "string") return o.id;
  if(typeof o.eventId === "string") return o.eventId;
  return null;
}
async function gcall(tool, input){
  const m = await getMcp();
  if(!m) throw {code:"unavailable_mcp"};
  return payloadOf(await m.callTool(GSERVER, tool, input));
}
function errText(e){
  const c = e && e.code;
  if(c==="unavailable_mcp") return "La connexion à Google Agenda n'est pas disponible ici (ouvrez la page dans Claude, connecté à votre compte).";
  if(c==="server_not_connected") return "Google Agenda n'est pas connecté à votre compte Claude (Paramètres → Connecteurs).";
  if(c==="consent_denied" || c==="not_granted") return "Accès à Google Agenda refusé.";
  return (e && (e.message || e.code)) || "Erreur inconnue";
}
function renderGcalInfo(){
  const el = $("gcalInfo"); if(!el) return;
  if(!gcal.on){ el.textContent = ""; return; }
  let s = gcal.auto ? "📆 Envoi automatique vers Google Agenda activé" : "📆 Envoi manuel vers Google Agenda";
  if(gcal.last) s += " · dernier envoi " + gcal.last;

  el.textContent = s; el.style.whiteSpace = "pre-line"; el.style.color = gcal.err ? "var(--red)" : "";
}
function addMin(hhmm, min){ const [h,m]=hhmm.split(":").map(Number); const t=h*60+m+min; return String(Math.floor(t/60)%24).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); }

function openGcal(){
  openSheet("Google Agenda", `
    <p class="hint">Tous les repas prévus et leurs notes sont envoyés dans Google Agenda (sans rappel, sans bloquer votre temps). Chaque ajout, modification ou suppression est répercuté.</p>

    </div>

    <div class="actions"><button class="btn main" id="g_go">📆 Enregistrer et tout envoyer</button>${gcal.on?'<button class="btn danger" id="g_off">Arrêter l\'envoi</button>':""}</div>

    try{
      const p = await gcall("list_calendars", {});
      const cals = ((p && p.calendars) || []).filter(c => !/group\.v\.calendar\.google\.com$/.test(c.id) && c.accessRole !== "reader" && c.accessRole !== "freeBusyReader");
      if(!cals.length) throw {message:"Aucun agenda trouvé."};
      sel_.innerHTML = cals.map(c=>`<option value="${esc(c.id)}" ${c.id===gcal.cal?"selected":""}>${esc(c.summary||c.id)}${c.primary?" (principal)":""}</option>`).join("");
      if(!gcal.cal || !cals.some(c=>c.id===gcal.cal)) sel_.value = (cals.find(c=>/^repas$/i.test((c.summary||"").trim()))||cals.find(c=>/famille|family/i.test(c.summary||""))||cals.find(c=>c.primary)||cals.find(c=>/@gmail\.com$/.test(c.id))||cals[0]).id;
    }catch(e){
      sel_.innerHTML = `<option value="">Agenda principal</option>`;
      $("g_prog").innerHTML = `<span class="ko">${esc(errText(e))}</span>`;

    $("g_go").onclick = () => {

/* Envoie TOUT : chaque repas prévu (toutes dates) + suppression des événements dont le repas a été effacé */
let gcalPending = false, gcalTimer = null;
function scheduleAutoSync(){
  if(!gcal.on || !gcal.auto) return;
  clearTimeout(gcalTimer);
  gcalTimer = setTimeout(() => runGcalSync(false), 2000);
}
function mealBody(k, slot, s){
  const t0 = slot==="midi" ? gcal.midi : gcal.soir;
  const m = s.plat ? findMenu(s.plat) : null;
  const desc = [
    s.note ? "📝 " + s.note : "",
    m && m.acc && m.acc!=="—" ? "Accompagnement : " + m.acc : "",
    m ? "Temps : " + m.temps + " min · " + m.diff : "",
    m && m.ing ? "Ingrédients : " + m.ing : "",
    m && m.astuce ? "💡 " + m.astuce : "",
    "— Menus de la famille"
  ].filter(Boolean).join("\n");
  return { summary: (slot==="midi"?"☀️ Midi : ":"🌙 Soir : ") + (s.plat || "Repas"), description: desc, startTime: k+"T"+t0+":00", endTime: k+"T"+addMin(t0,gcal.dur||60)+":00" };
}
async function runGcalSync(manual){
  if(!gcal.on) return;
  if(gcalBusy){ gcalPending = true; return; }
  const cal = gcal.cal;
  /* liste des créneaux à traiter : tous les repas prévus + tous les événements déjà envoyés */
  const keys = new Set(Object.keys(gcal.events));
  for(const [k, day] of Object.entries(state.plan)) for(const slot of ["midi","soir"]) if(day[slot] && (day[slot].plat || day[slot].note)) keys.add(k+"_"+slot);
  const todo = [];
  for(const ek of [...keys].sort()){
    const [k, slot] = ek.split("_");
    const s = getSlot(k, slot) || {};
    const ev = gcal.events[ek];
    if(!s.plat && !s.note){ if(ev) todo.push({ek,k,slot,s,ev,del:true}); continue; }
    const body = mealBody(k, slot, s), sig = JSON.stringify([body, cal]);
    if(ev && ev.sig === sig) continue;
    todo.push({ek,k,slot,s,ev,body,sig});
  }
  const prog = manual ? $("g_prog") : null, btn = manual ? $("g_go") : null;
  if(!todo.length){
    if(manual){ await saveGcal(); renderGcalInfo(); if(prog) prog.innerHTML = `<span class="ok">✓ Tout est déjà à jour dans Google Agenda.</span>`; }
    return;
  }
  gcalBusy = true; if(btn) btn.disabled = true;
  let created=0, updated=0, deleted=0; const errors=[];
  try{
    let i = 0;
    for(const x of todo){
      i++; if(prog) prog.textContent = `Envoi en cours… ${i}/${todo.length}`;
      if(!manual) setSync(`Google Agenda ${i}/${todo.length}…`);
      try{
        if(x.del){
          try{ await gcall("delete_event", {calendarId:x.ev.cal||undefined, eventId:x.ev.id, notificationLevel:"NONE"}); }catch(e){ if(e && e.code==="unavailable_mcp") throw e; }
          delete gcal.events[x.ek]; deleted++; continue;
        }
        if(x.ev && x.ev.cal === cal){
          try{
            await gcall("update_event", {...x.body, calendarId:cal||undefined, eventId:x.ev.id, notificationLevel:"NONE"});
            gcal.events[x.ek] = {...x.ev, sig:x.sig}; updated++; continue;
          }catch(e){ if(e && e.code==="unavailable_mcp") throw e; /* supprimé côté Google : on le recrée */ }
        } else if(x.ev){
          try{ await gcall("delete_event", {calendarId:x.ev.cal||undefined, eventId:x.ev.id, notificationLevel:"NONE"}); }catch(e){}
        }
        const p = await gcall("create_event", {...x.body, calendarId:cal||undefined, availability:"AVAILABILITY_FREE", useDefaultReminders:false, notificationLevel:"NONE"});
        const id = findId(p);
        if(id) gcal.events[x.ek] = {id, cal, sig:x.sig}; else delete gcal.events[x.ek];
        created++;
      }catch(e){
        errors.push(longDate(fromKey(x.k))+" "+SLOTS[x.slot].toLowerCase()+" : "+errText(e));
        if(e && ["unavailable_mcp","server_not_connected","consent_denied","not_granted"].includes(e.code)) throw e;
      }
    }
    const now = new Date();
    gcal.last = now.toLocaleDateString("fr-FR",{day:"numeric",month:"short"}) + " à " + now.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    gcal.err = errors.length ? `${errors.length} repas non envoyé(s)` : "";
    const msg = `✓ Google Agenda : ${created} ajouté(s), ${updated} modifié(s), ${deleted} supprimé(s).` + (errors.length ? "\n⚠️ " + errors.slice(0,4).join("\n⚠️ ") : "");
    if(prog) prog.innerHTML = `<span class="${errors.length?'ko':'ok'}">${esc(msg)}</span>`;
    toast(errors.length ? "Google Agenda : envoi incomplet" : "📆 Google Agenda mis à jour");
  }catch(e){
    gcal.err = errText(e);
    if(prog) prog.innerHTML = `<span class="ko">${esc(gcal.err)}</span>`;
  }
  await saveGcal(); renderGcalInfo();
  if(!manual) setSync(canWrite ? "✓ Synchronisé" : "Lecture seule", !canWrite);
  gcalBusy = false; if(btn) btn.disabled = false;
  if(gcalPending){ gcalPending = false; scheduleAutoSync(); }
}

(() => {
const SB_URL = "https://dqyobjaspxdfhjlqnrrc.supabase.co";
const SB_KEY = "sb_publishable_y0PIDa5WMNb-K0AcDaL8Ag_jKaPYiuW";
const CODE_KEY = "menus-famille-code";

async function rpc(fn, args){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method:"POST",
    headers:{ apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`, "Content-Type":"application/json" },
    body: JSON.stringify(args || {})
  });
  if(!r.ok){ let m = ""; try{ m = (await r.json()).message; }catch(_){} throw new Error(m || ("Erreur " + r.status)); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

/* ---- code famille : #f=CODE dans le lien, puis gardé sur l'appareil ---- */
let code = "";
const m = (location.hash || "").match(/f=([A-Za-z0-9_-]{20,})/);
if(m){ code = m[1]; try{ localStorage.setItem(CODE_KEY, code); }catch(_){} }
if(!code){ try{ code = localStorage.getItem(CODE_KEY) || ""; }catch(_){} }
if(code && !m){ try{ history.replaceState(null, "", location.pathname + location.search + "#f=" + code); }catch(_){} }
const shareLink = () => location.origin + location.pathname + "#f=" + code;
const icsLink = () => `${SB_URL}/functions/v1/agenda?f=${code}`;

/* ---- synchronisation ---- */
let synced = { plan:{}, custom:"[]", fav:"[]" }, lastTs = "", busy = 0, dirty = false;
const clone = o => JSON.parse(JSON.stringify(o));
function applyRemote(d){
  state.plan = d.plan || {}; state.custom = d.custom || []; state.fav = d.fav || [];
  if(d.settings){ gcal.midi = d.settings.midi || gcal.midi; gcal.soir = d.settings.soir || gcal.soir; }
  synced = { plan: clone(state.plan), custom: JSON.stringify(state.custom), fav: JSON.stringify(state.fav) };
  lastTs = d.updated_at || ""; saveLocal(); renderAll();
}
async function pull(){
  if(!code || busy || dirty) return;
  try{
    const d = await rpc("menus_get", { p_code: code });
    if(!d){ setSync("Code famille inconnu", true); return askCode(true); }
    if(d.updated_at !== lastTs && !busy && !dirty) applyRemote(d);
    setSync("✓ Synchronisé");
  }catch(e){ setSync("Hors ligne", true); }
}
function diffPlan(){
  const patch = {}; const a = synced.plan, b = state.plan;
  for(const k of new Set([...Object.keys(a), ...Object.keys(b)])){
    for(const s of ["midi","soir"]){
      const x = a[k] && a[k][s], y = b[k] && b[k][s];
      if(JSON.stringify(x||null) !== JSON.stringify(y||null)){ (patch[k] = patch[k] || {})[s] = y || null; }
    }
  }
  return patch;
}
async function push(){
  if(!code) return;
  if(busy){ dirty = true; return; }
  busy++; dirty = false; setSync("Enregistrement…");
  try{
    const patch = diffPlan();
    if(Object.keys(patch).length){
      const snap = clone(state.plan);
      lastTs = await rpc("menus_patch_plan", { p_code: code, p_patch: patch });
      synced.plan = snap;
    }
    const c = JSON.stringify(state.custom);
    if(c !== synced.custom){ lastTs = await rpc("menus_set", { p_code: code, p_field:"custom", p_value: state.custom }); synced.custom = c; }
    const f = JSON.stringify(state.fav);
    if(f !== synced.fav){ lastTs = await rpc("menus_set", { p_code: code, p_field:"fav", p_value: state.fav }); synced.fav = f; }
    setSync("✓ Enregistré");
  }catch(e){ setSync("Non enregistré – nouvel essai…", true); setTimeout(push, 5000); }
  busy--;
  if(dirty && busy===0){ push(); }
}
window.savePlan = () => { saveLocal(); push(); };
window.saveCustom = () => { saveLocal(); push(); };
window.saveFav = () => { saveLocal(); push(); };
window.scheduleAutoSync = () => {};

setInterval(() => { if(document.visibilityState === "visible") pull(); }, 15000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") pull(); });
window.addEventListener("focus", pull);

/* ---- écran « code famille » ---- */
function askCode(unknown){
  openSheet("Menus de la famille", `
    ${unknown ? '<p class="hint" style="color:var(--red)">Ce code famille n\'existe pas.</p>' : ""}
    <p class="hint">Pour retrouver le planning de votre famille, ouvrez le lien de partage reçu, ou collez le code famille ici.</p>
    <label class="fl">Code ou lien de la famille</label>
    <input class="inp" id="c_code" type="text" autocomplete="off" autocapitalize="off" placeholder="Collez le lien ou le code">
    <div class="actions"><button class="btn main" id="c_ok">Ouvrir</button></div>
    <p class="hint" style="margin-top:18px">Pas encore de famille ?</p>
    <div class="actions"><button class="btn ghost" id="c_new">Créer un nouveau planning</button></div>`, () => {
    $("c_ok").onclick = () => {
      const v = $("c_code").value.trim(); const mm = v.match(/([A-Za-z0-9_-]{20,})\s*$/);
      if(!mm) return toast("Code invalide");
      code = mm[1]; try{ localStorage.setItem(CODE_KEY, code); }catch(_){}
      history.replaceState(null, "", location.pathname + "#f=" + code);
      lastTs = ""; closeSheet(); pull();
    };
    $("c_new").onclick = async () => {
      try{
        code = await rpc("menus_create"); try{ localStorage.setItem(CODE_KEY, code); }catch(_){}
        history.replaceState(null, "", location.pathname + "#f=" + code);
        state.plan = {}; state.custom = []; state.fav = []; lastTs = ""; closeSheet(); await pull(); openShare();
      }catch(e){ toast("Impossible de créer : " + e.message); }
    };
  });
  const x = $("shClose"); if(x) x.style.visibility = code ? "" : "hidden";
}
const _close = window.closeSheet;
window.closeSheet = function(){ const x = $("shClose"); if(x) x.style.visibility = ""; _close(); };

/* ---- partage + abonnement agenda ---- */
async function copy(txt, label){
  try{ await navigator.clipboard.writeText(txt); toast(label + " copié"); }
  catch(e){ const i = document.createElement("textarea"); i.value = txt; document.body.appendChild(i); i.select(); try{ document.execCommand("copy"); toast(label + " copié"); }catch(_){ toast("Copie impossible"); } i.remove(); }
}
function openShare(){
  openSheet("Partager le planning", `
    <p class="hint">Envoyez ce lien à votre famille (SMS, WhatsApp…). Toute personne qui a le lien peut voir et modifier le planning : ne le publiez pas.</p>
    <input class="inp" readonly value="${esc(shareLink())}" onclick="this.select()">
    <div class="actions"><button class="btn main" id="s_copy">Copier le lien</button>${navigator.share ? '<button class="btn ghost" id="s_share">Envoyer…</button>' : ""}</div>
    <p class="hint" style="margin-top:16px">📱 Astuce : dans Safari, touchez <b>Partager → Sur l'écran d'accueil</b> pour l'avoir comme une application.</p>`, () => {
    $("s_copy").onclick = () => copy(shareLink(), "Lien");
    if($("s_share")) $("s_share").onclick = () => navigator.share({ title:"Menus de la famille", url: shareLink() }).catch(()=>{});
  });
}
function openIcs(){
  const link = icsLink();
  openSheet("Google Agenda / iPhone", `
    <p class="hint">Abonnez votre agenda à ce lien : tous les repas et notes y apparaissent et se mettent à jour tout seuls (Google Agenda actualise toutes les quelques heures).</p>
    <input class="inp" readonly value="${esc(link)}" onclick="this.select()">
    <div class="actions"><button class="btn main" id="i_copy">Copier le lien agenda</button><a class="btn ghost" href="${esc(link.replace(/^https:/, "webcal:"))}" style="text-decoration:none">Ajouter à l'agenda iPhone</a></div>
    <p class="hint" style="margin-top:14px"><b>Google Agenda</b> (sur ordinateur) : calendar.google.com → à côté de « Autres agendas » touchez <b>+</b> → <b>À partir de l'URL</b> → collez le lien → <b>Ajouter un agenda</b>.</p>
    <div class="row2" style="margin-top:6px">
      <div><label class="fl">Heure du midi</label><input class="inp" type="time" id="i_midi" value="${esc(gcal.midi)}"></div>
      <div><label class="fl">Heure du soir</label><input class="inp" type="time" id="i_soir" value="${esc(gcal.soir)}"></div>
    </div>
    <div class="actions"><button class="btn ghost" id="i_save">Enregistrer les heures</button></div>`, () => {
    $("i_copy").onclick = () => copy(link, "Lien agenda");
    $("i_save").onclick = async () => {
      gcal.midi = $("i_midi").value || "12:00"; gcal.soir = $("i_soir").value || "19:30";
      try{ await rpc("menus_set", { p_code: code, p_field:"settings", p_value:{ midi:gcal.midi, soir:gcal.soir } }); toast("Heures enregistrées"); }
      catch(e){ toast("Non enregistré"); }
    };
  });
}
$("gcalBtn").onclick = openIcs;
$("gcalBtn").textContent = "📆 Agenda (Google, iPhone)";
window.renderGcalInfo = () => { const el = $("gcalInfo"); if(el) el.textContent = ""; };
renderGcalInfo();

/* bouton partager dans l'en-tête */
const sync = $("sync");
const sh = document.createElement("button");
sh.className = "btn"; sh.style.cssText = "margin-top:4px;font-size:13px;padding:6px 10px"; sh.textContent = "👪 Partager";
sh.onclick = openShare;
const wrap = document.createElement("div");
wrap.style.cssText = "display:flex;flex-direction:column;align-items:flex-end";
sync.parentNode.insertBefore(wrap, sync); wrap.appendChild(sync); wrap.appendChild(sh);

/* démarrage */
if(code){ pull(); } else { setSync("Pas de famille", true); askCode(false); }
})();

</script>
</body>
</html>
